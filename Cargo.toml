[package]
name = "immich-timelapse"
version = "0.1.0"
edition = "2021"
description = "Create selfie timelapses from Immich using face recognition and alignment"
license = "MIT"
repository = "https://github.com/ArnaudCrl/immich-automated-selfie-timelapse"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Image processing
image = { version = "0.25", features = ["jpeg", "png", "webp"] }
imageproc = "0.25"
kamadak-exif = "0.5"

# ML models
ort = "2.0.0-rc.11"
dlib-face-recognition = { version = "0.3", features = ["embed-all"] }
ndarray = "0.16"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
bytes = "1"
tokio-util = "0.7"
futures-util = "0.3"
async-trait = "0.1"
dotenvy = "0.15"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "immich-timelapse"
path = "src/main.rs"
